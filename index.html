<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Connecting…</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
  a { color: #1d9150; }
</style>
</head>
<body>
<main>
  <p id="msg">Connecting Withings to your Health app…</p>
  <p><a id="link" href="#" hidden>Continue</a></p>
</main>
<script>
  // Withings only accepts a publicly reachable callback URL, and the app lives on a private
  // tailnet. This page hands the OAuth result (code + state) to the app in the same browser.
  // The destination is fixed, so this can't be used to redirect anywhere else.
  var APP_CALLBACK = "https://health.tail303742.ts.net/api/integrations/withings/callback";
  var target = APP_CALLBACK + window.location.search;
  var link = document.getElementById("link");
  link.href = target;
  if (window.location.search) {
    link.hidden = false;
    window.location.replace(target);
  } else {
    document.getElementById("msg").textContent = "Withings callback page for a personal Health app.";
  }
</script>
</body>
</html>
